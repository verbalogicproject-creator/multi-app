# The verification gates, run non-interactively so regressions surface between
# sessions instead of mid-session. Mirrors `scripts/gates.sh` — that script is the
# source of truth for which gates exist; this file only decides when they run.
#
# Two jobs, because the tiers have genuinely different costs:
#
#   fast  — every push and PR. No build, no browser, ~30s locally.
#   full  — manual (`workflow_dispatch`) only, for now. It downloads a Chromium and
#           runs the four CDP gates, ~5min locally. It is opt-in rather than
#           on-push because it has never been observed green on a GitHub runner:
#           it passes here, and "passes on the author's device" is not evidence
#           about CI. Promote it to `push` once a manual run proves it.
#
# Both jobs check out TWO repositories. `package.json` declares the memory engine
# as `file:../multi-graph-memory`, a sibling directory — which for a long time
# existed on exactly one device, so a clean clone got a dangling symlink and three
# of the four fast gates could not pass anywhere else. `actions/checkout` refuses
# to write above the workspace, so this repo is checked out into `multi-app/` and
# the engine beside it, making `../multi-graph-memory` resolve the way it does
# locally. Every step then runs with `working-directory: multi-app`.
#
# The engine is taken at `master`, not a pinned SHA, because the local `file:`
# dependency also always resolves to whatever is checked out there — pinning here
# would make CI test something the author never builds against. The resolved SHA
# is echoed so a failure can be attributed to an engine change.
name: gates

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:

env:
  # server.js refuses to boot without a provider credential, so check:auth cannot
  # even reach its assertions without one. Present so the server starts, invalid so
  # nothing can be spent — the same posture scripts/smoke-memory.mjs already takes.
  # Every gate in CI is offline; a gate that needs a real key is not a gate, it is
  # a purchase.
  GEMINI_API_KEY: ci-not-a-real-key-nothing-may-be-spent

jobs:
  fast:
    name: gates (fast tier)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: multi-app

      - name: Check out the memory engine
        uses: actions/checkout@v4
        with:
          repository: verbalogicproject-creator/multi-graph-memory
          path: multi-graph-memory

      - uses: actions/setup-node@v4
        with:
          node-version: '24'      # package.json engines: node >=24
          cache: npm
          cache-dependency-path: multi-app/package-lock.json

      # The engine ships no dist/ and its exports all point into one, so it has to
      # be installed and built before anything can import it.
      - name: Build the memory engine
        working-directory: multi-graph-memory
        run: |
          echo "engine at $(git rev-parse HEAD)"
          npm ci
          npm run build

      - name: Install
        working-directory: multi-app
        run: npm ci

      - name: Run gates
        working-directory: multi-app
        run: scripts/gates.sh --tier fast

      - name: Triage gate failures
        if: failure()
        continue-on-error: true    # triage must never mask or replace the real failure
        working-directory: multi-app
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "${ANTHROPIC_API_KEY:-}" ]; then
            echo "No ANTHROPIC_API_KEY secret configured - skipping automated triage."
            exit 0
          fi
          npx -y @anthropic-ai/claude-code \
            -p "The gates in scripts/gates.sh failed on this run. Re-run the failing gate, read its output, and report the root cause plus the minimal fix. Do not edit files." \
            --allowedTools "Read,Bash"

  full:
    name: gates (full tier, manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: multi-app

      - name: Check out the memory engine
        uses: actions/checkout@v4
        with:
          repository: verbalogicproject-creator/multi-graph-memory
          path: multi-graph-memory

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: multi-app/package-lock.json

      - name: Build the memory engine
        working-directory: multi-graph-memory
        run: |
          echo "engine at $(git rev-parse HEAD)"
          npm ci
          npm run build

      - name: Install
        working-directory: multi-app
        run: npm ci

      # `playwright-core` ships the install CLI but no browser. Install the revision
      # this exact playwright-core expects, then ask it where that landed — deriving
      # the path instead of hardcoding one is the whole point of CHROME_PATH.
      - name: Install Chromium
        working-directory: multi-app
        run: npx playwright-core install --with-deps chromium

      - name: Resolve Chromium path
        working-directory: multi-app
        run: |
          CHROME_PATH="$(node -e "import('playwright-core').then(p => console.log(p.chromium.executablePath()))")"
          echo "Resolved: $CHROME_PATH"
          test -x "$CHROME_PATH" || { echo "resolved path is not executable"; exit 1; }
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"

      - name: Run gates
        working-directory: multi-app
        run: scripts/gates.sh --tier full --start-server
